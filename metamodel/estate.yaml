id: urn:estate-graph:model
name: estate_graph
description: 'The concepts of an estate reading: state, actions and their parts, rules, calculations, capabilities, journeys
  and cases.'
prefixes:
  linkml: https://w3id.org/linkml/
  eg: 'urn:estate-graph:model:'
imports:
- linkml:types
- modules/state
- modules/actions
- modules/rules
- modules/capabilities
- modules/cases
- modules/open
default_prefix: eg
default_range: string
classes:
  EstateGraph:
    tree_root: true
    attributes:
      estates:
        range: Estate
        required: true
        multivalued: true
        inlined_as_list: true
      types:
