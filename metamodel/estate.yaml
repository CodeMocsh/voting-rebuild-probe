        required: true
        multivalued: true
        inlined_as_list: true
      inputs:
        range: Input
        required: true
        multivalued: true
        inlined_as_list: true
      actions:
        range: Action
        required: true
        multivalued: true
        inlined_as_list: true
      triggers:
        range: Trigger
        required: true
        multivalued: true
        inlined_as_list: true
      updates:
        range: Update
        required: true
        multivalued: true
        inlined_as_list: true
      transitions:
        range: Transition
        required: true
        multivalued: true
        inlined_as_list: true
      outputs:
        range: Output
        required: true
        multivalued: true
        inlined_as_list: true
      rules:
