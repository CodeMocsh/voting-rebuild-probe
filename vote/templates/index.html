<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{option_a}} vs {{option_b}}!</title>
    <base href="/index.html">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <meta name="keywords" content="docker-compose, docker, stack">
    <meta name="author" content="Tutum dev team">
    <link rel='stylesheet' href="{{ url_for('static',filename='stylesheets/style.css') }}" />
  </head>
  <body>
    <div id="content-container">
      <div id="content-container-center">
        <h3>{{option_a}} vs {{option_b}}!</h3>
        {% if unavailable %}
        <p id="unavailable">Your vote could not be taken right now. Please try again.</p>
        {% endif %}
        <form id="choice" name='form' method="POST" action="/">
          <button id="a" type="submit" name="vote" class="a{% if vote == 'b' %} faded{% endif %}" value="a"{% if vote == 'a' %} disabled{% endif %}>{{option_a}}{% if vote == 'a' %} <span class="tick">&#10004;</span>{% endif %}</button>
          <button id="b" type="submit" name="vote" class="b{% if vote == 'a' %} faded{% endif %}" value="b"{% if vote == 'b' %} disabled{% endif %}>{{option_b}}{% if vote == 'b' %} <span class="tick">&#10004;</span>{% endif %}</button>
        </form>
        <div id="tip">
          (Tip: you can change your vote)
        </div>
        <div id="hostname">
          Processed by container ID {{hostname}}
        </div>
      </div>
    </div>
  </body>
</html>
